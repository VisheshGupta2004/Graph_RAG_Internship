<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Track Hopper – iCard Microlearning</title>
<style>
:root {
  --c-forest: #1b5e20; --c-teal: #006064; --c-purple: #4a148c;
  --c-orange: #e65100; --c-slate: #1a237e; --c-red: #b71c1c;
  --c-brown: #3e2723; --c-green: #2e7d32; --c-quiz: #212121;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; overflow:hidden; font-family:'Segoe UI',Arial,sans-serif; background:#000; }

/* ── DECK WRAPPER ── */
#deck { position:relative; width:100%; height:100%; }

/* ── CARDS ── */
.card {
  position:absolute; inset:0; display:flex; flex-direction:column;
  overflow:hidden; transition:transform .38s cubic-bezier(.4,0,.2,1), opacity .38s;
  will-change:transform; backface-visibility:hidden;
  user-select:none;
}
.card.hidden     { transform:translateX(100%); pointer-events:none; opacity:0; }
.card.exit-left  { transform:translateX(-100%); pointer-events:none; opacity:0; }
.card.active     { transform:translateX(0); opacity:1; }

/* ── PROGRESS BAR (top) ── */
.prog-row {
  position:absolute; top:0; left:0; right:0; z-index:20;
  display:flex; gap:3px; padding:12px 14px 0;
}
.prog-seg {
  flex:1; height:3px; border-radius:3px; background:rgba(255,255,255,.28);
  overflow:hidden;
}
.prog-seg .fill { height:100%; width:0%; background:#fff; border-radius:3px; transition:width .35s linear; }
.prog-seg.done .fill  { width:100%; }
.prog-seg.active .fill { animation:progAnim var(--dur, 999s) linear forwards; }
@keyframes progAnim { from{width:0%} to{width:100%} }

/* ── MODULE LABEL ── */
.mod-label {
  position:absolute; top:22px; right:14px; z-index:21;
  background:rgba(0,0,0,.38); border:1px solid rgba(255,255,255,.2);
  color:#fff; font-size:10px; font-weight:700; letter-spacing:.8px;
  text-transform:uppercase; padding:3px 10px; border-radius:20px;
}

/* ── NAV ZONES ── */
.nav-left, .nav-right {
  position:absolute; top:0; bottom:0; z-index:10; cursor:pointer; width:40%;
}
.nav-left  { left:0; }
.nav-right { right:0; }

/* ── NAV ARROWS ── */
.arrow {
  position:absolute; bottom:22px; z-index:25;
  background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.3);
  border-radius:50%; width:40px; height:40px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-size:18px; color:#fff; transition:background .2s;
}
.arrow:hover { background:rgba(255,255,255,.3); }
#arr-left  { left:18px; }
#arr-right { right:18px; }
#arr-left.hidden-btn, #arr-right.hidden-btn { opacity:.2; pointer-events:none; }

/* counter */
#counter {
  position:fixed; bottom:26px; left:50%; transform:translateX(-50%);
  z-index:30; font-size:12px; color:rgba(255,255,255,.55); pointer-events:none;
}

/* ── CARD CONTENT HELPERS ── */
.card-body {
  flex:1; display:flex; flex-direction:column; padding:58px 22px 72px;
  justify-content:center;
}
.eyebrow { font-size:11px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase; opacity:.7; margin-bottom:10px; }
.card-h1 { font-size:clamp(26px,5.5vw,42px); font-weight:900; line-height:1.2; margin-bottom:14px; }
.card-h2 { font-size:clamp(20px,4vw,30px); font-weight:800; line-height:1.3; margin-bottom:12px; }
.card-p  { font-size:clamp(13px,2.2vw,16px); line-height:1.65; opacity:.92; margin-bottom:10px; }
.pill {
  display:inline-block; padding:4px 14px; border-radius:20px;
  font-size:11px; font-weight:700; margin:3px 4px 3px 0; letter-spacing:.5px;
}
.big-stat { font-size:clamp(52px,12vw,80px); font-weight:900; line-height:1; }
.big-unit { font-size:clamp(16px,3vw,22px); font-weight:600; opacity:.75; }

/* callout boxes */
.callout {
  border-radius:10px; padding:12px 15px; margin:12px 0;
  border-left:4px solid; font-size:clamp(12px,2vw,14px);
}
.callout .cl { font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }
.callout-warn  { background:rgba(255,167,38,.12); border-color:#ffa726; color:#fff3e0; }
.callout-warn .cl { color:#ffa726; }
.callout-danger{ background:rgba(239,83,80,.12); border-color:#ef5350; color:#ffeaea; }
.callout-danger .cl { color:#ef5350; }
.callout-key   { background:rgba(102,187,106,.12); border-color:#66bb6a; color:#e8f5e9; }
.callout-key .cl { color:#66bb6a; }
.callout-info  { background:rgba(41,182,246,.12); border-color:#29b6f6; color:#e1f5fe; }
.callout-info .cl { color:#29b6f6; }

/* list */
.iclist { list-style:none; }
.iclist li { display:flex; gap:10px; padding:7px 0; border-bottom:1px solid rgba(255,255,255,.08); font-size:clamp(12px,2vw,14px); align-items:flex-start; }
.iclist li:last-child { border:none; }
.iclist li .ic2 { font-size:17px; flex-shrink:0; }

/* grid 2-col */
.g2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0; }
.g2-card { border-radius:10px; padding:12px; font-size:clamp(11px,1.8vw,13px); border:1px solid rgba(255,255,255,.15); }
.g2-card h4 { font-size:clamp(12px,2vw,14px); font-weight:700; margin-bottom:6px; }

/* SVG container */
.svg-frame { margin:14px 0; border-radius:12px; overflow:hidden; background:rgba(0,0,0,.25); border:1px solid rgba(255,255,255,.1); text-align:center; }
.svg-frame svg { max-width:100%; height:auto; display:block; margin:0 auto; }
.svg-cap { font-size:11px; padding:6px 10px; opacity:.65; text-align:center; font-style:italic; }

/* ── QUIZ ── */
.quiz-opt {
  display:flex; align-items:center; gap:12px;
  padding:11px 15px; border-radius:10px; margin-bottom:9px; cursor:pointer;
  border:2px solid rgba(255,255,255,.2); transition:all .2s;
  font-size:clamp(13px,2.2vw,15px); color:#fff;
}
.quiz-opt:hover { border-color:rgba(255,255,255,.5); background:rgba(255,255,255,.08); }
.quiz-opt .qnum { width:28px; height:28px; border-radius:50%; border:2px solid rgba(255,255,255,.4); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0; }
.quiz-opt.correct { border-color:#66bb6a; background:rgba(102,187,106,.18); }
.quiz-opt.wrong   { border-color:#ef5350; background:rgba(239,83,80,.15); }
.quiz-feedback { padding:12px 15px; border-radius:8px; margin-top:10px; font-size:13px; display:none; }
.quiz-feedback.show { display:block; }
.quiz-feedback.ok  { background:rgba(102,187,106,.15); border:1px solid #66bb6a; color:#e8f5e9; }
.quiz-feedback.no  { background:rgba(239,83,80,.12); border:1px solid #ef5350; color:#ffeaea; }

/* ── SPECIFIC CARD THEMES ── */
/* cover */
.cover-card { background:linear-gradient(160deg,#1b3a1f 0%,#2e6b35 50%,#1a5276 100%); color:#fff; }
/* how to use */
.how-card { background:linear-gradient(160deg,#212121 0%,#1a237e 100%); color:#fff; }

/* CB themes */
.cb1-card { background:linear-gradient(160deg,#1b5e20 0%,#2e7d32 100%); color:#fff; }
.cb2-card { background:linear-gradient(160deg,#006064 0%,#00838f 100%); color:#fff; }
.cb3-card { background:linear-gradient(160deg,#3e2723 0%,#6d4c41 100%); color:#fff; }
.cb4-card { background:linear-gradient(160deg,#4a148c 0%,#6a1b9a 100%); color:#fff; }
.cb5-card { background:linear-gradient(160deg,#e65100 0%,#bf360c 100%); color:#fff; }
.cb6-card { background:linear-gradient(160deg,#1a237e 0%,#283593 100%); color:#fff; }
.cb7-card { background:linear-gradient(160deg,#b71c1c 0%,#c62828 100%); color:#fff; }
.cb8-card { background:linear-gradient(160deg,#212121 0%,#37474f 100%); color:#fff; }
.cp-card-t { background:linear-gradient(160deg,#1a3a4a 0%,#0d47a1 100%); color:#fff; }
.fc-card-t { background:linear-gradient(160deg,#4a0e0e 0%,#b71c1c 100%); color:#fff; }
.quiz-card { background:linear-gradient(160deg,#1a1a2e 0%,#16213e 100%); color:#fff; }
.out-card  { background:linear-gradient(160deg,#1b5e20 0%,#0d2b63 100%); color:#fff; }

/* flow diagram steps */
.flow-step {
  display:flex; align-items:center; gap:10px; padding:10px 14px;
  border-radius:10px; margin-bottom:8px;
  border:1px solid rgba(255,255,255,.2);
  font-size:clamp(12px,2vw,14px);
}
.flow-step .fnum { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; flex-shrink:0; }
.flow-step .farr { font-size:18px; opacity:.5; }

/* hazard zone pill */
.hz { border-radius:10px; padding:14px; margin:8px 0; border:1px solid rgba(255,255,255,.15); }
.hz h4 { font-size:13px; font-weight:800; margin-bottom:4px; }
.hz p  { font-size:12px; opacity:.85; }

/* failure card items */
.fail-item { border-radius:10px; padding:14px; margin:10px 0; border-left:4px solid #ef5350; background:rgba(239,83,80,.1); }
.fail-item .fi-tag { font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:1px; color:#ef5350; margin-bottom:5px; }
.fail-item h4  { font-size:14px; font-weight:700; color:#fff; margin-bottom:4px; }
.fail-item p   { font-size:12px; opacity:.85; }

/* outcome tick list */
.ot-list li { border-bottom:1px solid rgba(255,255,255,.08); padding:9px 0; display:flex; gap:10px; align-items:flex-start; font-size:clamp(12px,2vw,14px); }
.ot-chk { color:#66bb6a; font-size:18px; flex-shrink:0; }

/* module nav dots */
#mod-dots {
  position:fixed; top:50%; right:10px; transform:translateY(-50%);
  z-index:30; display:flex; flex-direction:column; gap:5px;
}
.mdot { width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.3); cursor:pointer; transition:all .2s; }
.mdot.active { background:#fff; width:9px; height:9px; }

/* tap hint */
#tap-hint {
  position:fixed; bottom:68px; left:50%; transform:translateX(-50%);
  z-index:30; font-size:11px; color:rgba(255,255,255,.45);
  pointer-events:none; animation:fadeHint 4s ease forwards;
}
@keyframes fadeHint { 0%{opacity:1} 70%{opacity:1} 100%{opacity:0} }
</style>

  <div class="card-h2">Break one link,<br>break the chain</div>

    <li><span class="ic2">🔴</span><span><strong>Feeder fails</strong> → hopper fills and overflows → coal receipt stops</span></li>
    <li><span class="ic2">🔴</span><span><strong>Conveyor trips</strong> → all downstream processes freeze instantly</span></li>
  </ul>
  <div class="callout callout-danger" style="margin-top:10px">
    <div class="cl">🚨 Consequence</div>
    Any failure here reaches the boiler within hours. A 660 MW unit at reduced load loses crores in revenue every hour.
  </div>
</div>`},

{mod:5, theme:'cb4-card', html:`
<div class="card-body">
  <div class="eyebrow" style="color:#ce93d8">Concept Block 4 · Grizzly</div>
  <div class="card-h2">What happens if the<br>grizzly fails?</div>
  <div class="callout callout-danger" style="margin-top:8px">
    <div class="cl">🚨 Chain of Destruction</div>
    Broken bar → large boulder enters hopper → reaches feeder → feeder belt/chain destroyed → <strong>days of downtime</strong>
  </div>
  <ul class="iclist" style="margin-top:12px">
    <li><span class="ic2">🪨</span><span><strong>Boulder/large lump</strong> — destroys feeder belt or apron chain completely</span></li>
    <li><span class="ic2">🔩</span><span><strong>Metal debris</strong> (bolts, wire) — cuts conveyor belt downstream</span></li>
    <li><span class="ic2">🌿</span><span><strong>Rope or wood</strong> — wraps around feeder shaft, causes jam and stall</span></li>
    <li><span class="ic2">🪨</span><span><strong>Shale/stone</strong> — jams between apron plates, cracking the steel pans</span></li>
  </ul>
  <div class="callout callout-warn" style="margin-top:12px">
    <div class="cl">⚠ Rule</div>
    Broken grizzly bars are treated as emergency repairs — not routine maintenance. A bar gap means the entire system below is unprotected.
  </div>
</div>`},

  <div class="card-h2">Why a feeder is needed</div>
  <div class="card-p">Without a feeder, coal in the hopper would rush out uncontrollably — sometimes flooding the conveyor, sometimes blocking and stopping entirely.</div>
  <div style="margin:16px 0;text-align:center">

        <div style="font-size:11px;opacity:.7">(uncontrolled)</div>
      </div>
      <div style="font-size:30px;opacity:.5">→</div>
      <div style="text-align:center">
        <div style="font-size:32px">⚙</div>
        <div style="font-size:11px;opacity:.7">Feeder</div>
        <div style="font-size:11px;opacity:.7">(controls rate)</div>
      </div>
      <div style="font-size:30px;opacity:.5">→</div>
      <div style="text-align:center">
        <div style="font-size:32px">➡</div>
        <div style="font-size:11px;opacity:.7">Steady stream</div>
        <div style="font-size:11px;opacity:.7">to conveyor</div>
      </div>
    </div>
  </div>
  <div class="callout callout-info">
    <div class="cl">ℹ Mental Model</div>

</div>`},

{mod:7, theme:'cb6-card', html:`
<div class="card-body">
  <div class="eyebrow" style="color:#9fa8da">Concept Block 6 · Coal Flow Behaviour</div>
  <div class="card-h2">Coal is NOT<br>a liquid</div>
  <div style="font-size:56px;text-align:center;margin:14px 0">🪨</div>
  <div class="card-p">Most people assume coal flows like water. It doesn't. Coal is a <strong>bulk solid</strong> — it flows, yes, but it also <em>stops, bridges, jams, and collapses suddenly</em>.</div>
  <div class="callout callout-info" style="margin-top:10px">
    <div class="cl">ℹ Key Behaviour Patterns</div>
    <strong>Normal flow</strong> → coal slides steadily through hopper walls to feeder<br><br>
    <strong>Arch formation</strong> → coal particles interlock and create a bridge, stopping flow<br><br>
    <strong>Surge flow</strong> → arch collapses suddenly, releasing all backed-up coal at once
  </div>
  <div class="card-p" style="margin-top:8px">Both arch formation and surge flow are dangerous — for equipment <em>and</em> for people nearby. Swipe to understand each one.</div>
</div>`},

// ═══════════════════════════════════════════════════════
//  RENDER & NAVIGATION
// ═══════════════════════════════════════════════════════
let current = 0;
const deck = document.getElementById('deck');

// Build progress bar segments (grouped by module)
function buildProgressBar(cardEl) {
  const row = document.createElement('div');
  row.className = 'prog-row';
  CARDS.forEach((_, i) => {
    const seg = document.createElement('div');
    seg.className = 'prog-seg' + (i < current ? ' done' : i === current ? ' active' : '');
    const fill = document.createElement('div');
    fill.className = 'fill';
    seg.appendChild(fill);
    row.appendChild(seg);
  });
  cardEl.appendChild(row);
}

function buildModLabel(cardEl, modIdx) {
  const m = MODULES[modIdx];
  if (!m || !m.label) return;
  const lbl = document.createElement('div');
  lbl.className = 'mod-label';
  lbl.textContent = m.label;
  cardEl.appendChild(lbl);
}

function buildNavZones(cardEl) {
  ['nav-left','nav-right'].forEach((cls,i) => {
    const z = document.createElement('div');
    z.className = cls;
    z.onclick = i === 0 ? prevCard : nextCard;
    cardEl.appendChild(z);
  });
}

function renderCards() {
  deck.innerHTML = '';
  CARDS.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = `card ${c.theme} ${i === current ? 'active' : 'hidden'}`;
    el.dataset.index = i;
    el.innerHTML = c.html;
    buildProgressBar(el);
    buildModLabel(el, c.mod);
    buildNavZones(el);
    deck.appendChild(el);
  });
  updateUI();
}

function updateUI() {
  document.getElementById('counter').textContent = `${current + 1} / ${CARDS.length}`;
  document.getElementById('arr-left').classList.toggle('hidden-btn', current === 0);
  document.getElementById('arr-right').classList.toggle('hidden-btn', current === CARDS.length - 1);

  // Rebuild progress
  document.querySelectorAll('.card').forEach((el, i) => {
    const segs = el.querySelectorAll('.prog-seg');
    segs.forEach((seg, j) => {
      seg.classList.remove('done','active');
      if (j < current) seg.classList.add('done');
      else if (j === current) seg.classList.add('active');
    });
  });

  // Module dots
  const activeMod = CARDS[current].mod;
  document.querySelectorAll('.mdot').forEach((d,i) => {
    d.classList.toggle('active', i === activeMod);
  });
}

function goTo(idx) {
  if (idx < 0 || idx >= CARDS.length) return;
  const cards = document.querySelectorAll('.card');
  const dir = idx > current ? 1 : -1;
  cards[current].className = `card ${CARDS[current].theme} ${dir > 0 ? 'exit-left' : 'hidden'}`;
  current = idx;
  cards[current].className = `card ${CARDS[current].theme} active`;
  updateUI();
}

function nextCard() { goTo(current + 1); }
function prevCard() { goTo(current - 1); }

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextCard();
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   prevCard();
});

// Touch / Swipe
let touchStartX = 0, touchStartY = 0;
document.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
    if (dx < 0) nextCard(); else prevCard();
  }
}, { passive: true });

// Module dots
function buildModDots() {
  const dotContainer = document.getElementById('mod-dots');
  MODULES.forEach((m, i) => {
    const d = document.createElement('div');
    d.className = 'mdot' + (i === CARDS[current].mod ? ' active' : '');
    d.title = m.label || 'Intro';
    d.onclick = () => {
      const targetIdx = CARDS.findIndex(c => c.mod === i);
      if (targetIdx >= 0) goTo(targetIdx);
    };
    dotContainer.appendChild(d);
  });
}

// Quiz logic
function checkQ(qid, el, correct) {
  const block = document.getElementById(qid);
  if (block.dataset.answered) return;
  block.dataset.answered = '1';
  const opts = block.querySelectorAll('.quiz-opt');
  opts.forEach(o => o.style.pointerEvents = 'none');
  el.classList.add(correct ? 'correct' : 'wrong');
  if (!correct) {
    opts.forEach(o => {
      if (o.onclick.toString().includes('true')) o.classList.add('correct');
    });
  }
  const fb = document.getElementById(qid + '-fb');
  if (fb) {
    fb.classList.add('show', correct ? 'ok' : 'no');
    fb.innerHTML = correct
      ? '✅ <strong>Correct!</strong> ' + getFeedback(qid)
      : '❌ <strong>Not quite.</strong> ' + getFeedback(qid);
  }
}

function getFeedback(qid) {
  const map = {
    q1: 'Track Hoppers use bottom-discharge wagons (BOXN-HL type). No tipping or rotation — coal falls by gravity.',
    q2: 'The grizzly is the only barrier between uncontrolled wagon contents and the precision machinery below. A boulder bypassing a broken bar can destroy the feeder completely.',
    q3: 'Coal particles interlock to form a bridge (arch), stopping all flow. When the arch collapses, all backed-up coal surges out at once — a dangerous and sudden event.',
    q4: 'The feeder may still be running. An arch may be ready to collapse. Grizzly bars may be wet and slippery. Coal dust may be in the underground gallery. It is never safe to approach without authorisation.'
  };
  return map[qid] || '';
}

// Init
renderCards();
buildModDots();
</script>
</body>
</html>
